name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: educsyn
          POSTGRES_PASSWORD: educsyn
          POSTGRES_DB: educsyn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educsyn -d educsyn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: educsyn
      DB_PASSWORD: educsyn
      DB_NAME: educsyn
      DATABASE_URL: postgres://educsyn:educsyn@localhost:5432/educsyn
      EDUCSYN_JWT_SECRET: ci-only-secret-longer-than-thirty-two-characters
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Verifier TypeScript strict
        run: npm run typecheck:strict

      - name: Construire le backend
        run: npm run build

      - name: Executer les tests globaux backend
        run: npm run test:global

      - name: Executer les tests backend
        run: npm run test:ci

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Construire le frontend
        run: npm run build

      - name: Executer les tests frontend
        run: npm test
